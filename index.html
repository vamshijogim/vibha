<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  /* THEMES */
  :root, [data-theme="peach"] {
    --bg-1: #fff5ed; --bg-2: #ffe4d1; --bg-3: #ffd0b5;
    --surface: rgba(255,255,255,0.65); --surface-2: rgba(255,255,255,0.85);

    --ring-1: #ff6b6b; --ring-2: #ffa94d; --ring-3: #f783ac;

    --grad-sat: linear-gradient(135deg, #ff6b6b, #ffa94d);
    --grad-calc: linear-gradient(135deg, #6ba8ff, #4a8ce8);
    --grad-stats: linear-gradient(135deg, #ffd75e, #ff9472);

    --grad-env: linear-gradient(135deg, #5dd49a, #34c876);
    --grad-art: linear-gradient(135deg, #f783ac, #d63384);
    --grad-collin: linear-gradient(135deg, #b794f6, #9061eb);
    --grad-algebra: linear-gradient(135deg, #ffb978, #ff8c42);
  }
  [data-theme="wrapped"] {
    --bg-1: #1a0b2e; --bg-2: #2d1b4e; --bg-3: #1f3a8a;

    --border: rgba(255,255,255,0.10);
    --text: #fff9f0; --text-soft: rgba(255,249,240,0.75); --text-mute: rgba(255,249,240,0.45);
    --accent: #fe6f5e; --accent-2: #84fab0;
    --ring-1: #fe6f5e; --ring-2: #84fab0; --ring-3: #c084fc;
    --shadow: 0 10px 40px rgba(254,111,94,0.25);
    --grad-hero: linear-gradient(135deg, #84fab0, #c084fc 50%, #fe6f5e);
    --grad-sat: linear-gradient(135deg, #fe6f5e, #f6d365);
    --grad-calc: linear-gradient(135deg, #84fab0, #6ba8ff);
    --grad-stats: linear-gradient(135deg, #f6d365, #fe6f5e);
    --grad-lit: linear-gradient(135deg, #c084fc, #fe6f5e);
    --grad-env: linear-gradient(135deg, #84fab0, #5dd49a);
    --grad-art: linear-gradient(135deg, #c084fc, #ff6b9d);
    --grad-collin: linear-gradient(135deg, #c084fc, #6ba8ff);
    --grad-algebra: linear-gradient(135deg, #f6d365, #fe6f5e);
  }
  [data-theme="costar"] {
    --bg-1: #f5f0e8; --bg-2: #e8e0d3; --bg-3: #d4c4b0;
    --surface: rgba(255,253,248,0.75); --surface-2: rgba(255,253,248,0.92);
    --border: rgba(40,40,40,0.08);
    --text: #1a1a1a; --text-soft: #555; --text-mute: #888;
    --accent: #4a3aff; --accent-2: #d4a5ff;

    --grad-collin: linear-gradient(135deg, #d4a5ff, #4a3aff);

  }
  [data-theme="y2k"] {
    --bg-1: #e0e4ff; --bg-2: #f4e4ff; --bg-3: #ffe4f0;

    --grad-hero: linear-gradient(135deg, #06b6d4, #ec4899 50%, #fbbf24);
    --grad-sat: linear-gradient(135deg, #ec4899, #fbbf24);
    --grad-calc: linear-gradient(135deg, #06b6d4, #a855f7);
    --grad-stats: linear-gradient(135deg, #fbbf24, #ec4899);
    --grad-lit: linear-gradient(135deg, #ec4899, #a855f7);
    --grad-env: linear-gradient(135deg, #06b6d4, #84fab0);
    --grad-art: linear-gradient(135deg, #ec4899, #06b6d4);
    --grad-collin: linear-gradient(135deg, #a855f7, #06b6d4);
    --grad-algebra: linear-gradient(135deg, #fbbf24, #ec4899);
  }
  [data-theme="mint"] {
    --bg-1: #f0fdf4; --bg-2: #d4f5e0; --bg-3: #b8edc8;
    --surface: rgba(255,255,255,0.70); --surface-2: rgba(255,255,255,0.88);
    --border: rgba(16,185,129,0.12);
    --text: #14532d; --text-soft: #4d7c5f; --text-mute: #87a899;
    --accent: #10b981; --accent-2: #34d399;
    --ring-1: #10b981; --ring-2: #facc15; --ring-3: #06b6d4;

    --grad-hero: linear-gradient(135deg, #10b981, #facc15 50%, #34d399);
    --grad-sat: linear-gradient(135deg, #10b981, #facc15);
    --grad-calc: linear-gradient(135deg, #06b6d4, #10b981);

    --grad-art: linear-gradient(135deg, #facc15, #34d399);
    --grad-collin: linear-gradient(135deg, #06b6d4, #10b981);
    --grad-algebra: linear-gradient(135deg, #facc15, #10b981);
  }
  [data-theme="midnight"] {
    --bg-1: #0a0a14; --bg-2: #1a1530; --bg-3: #2a1a45;
    --surface: rgba(255,255,255,0.06); --surface-2: rgba(255,255,255,0.10);
    --border: rgba(255,255,255,0.08);
    --text: #f5f5fa; --text-soft: rgba(245,245,250,0.65); --text-mute: rgba(245,245,250,0.40);
    --accent: #ff5e9c; --accent-2: #b794f6;
    --ring-1: #ff5e9c; --ring-2: #b794f6; --ring-3: #7ee7e7;
    --shadow: 0 10px 40px rgba(0,0,0,0.4);
    --grad-hero: linear-gradient(135deg, #ff5e9c, #b794f6 50%, #7ee7e7);
    --grad-sat: linear-gradient(135deg, #ff5e9c, #b794f6);
    --grad-calc: linear-gradient(135deg, #7ee7e7, #b794f6);
    --grad-stats: linear-gradient(135deg, #b794f6, #ff5e9c);
    --grad-lit: linear-gradient(135deg, #ff5e9c, #7ee7e7);
    --grad-env: linear-gradient(135deg, #7ee7e7, #84fab0);
    --grad-art: linear-gradient(135deg, #ff5e9c, #b794f6);
    --grad-collin: linear-gradient(135deg, #b794f6, #7ee7e7);
    --grad-algebra: linear-gradient(135deg, #ffa94d, #ff5e9c);
  }

  html { background: var(--bg-1); }
  body {
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment: fixed; min-height: 100vh;
    color: var(--text); -webkit-font-smoothing: antialiased;
    overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom);
    transition: background 0.5s;
  }
  
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; z-index: 1; padding: 14px 14px 110px; }
  
  /* HEADER */
  .hdr { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 14px; }
  .hdr-name { font-size: 24px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .hdr-name .em { background: var(--grad-hero); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hdr-stats { display: flex; gap: 5px; align-items: center; }
  .stat-chip { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); padding: 5px 10px; border-radius: 100px; font-size: 11px; font-weight: 800; color: var(--text); box-shadow: var(--shadow); }
  .theme-btn { background: var(--surface-2); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; box-shadow: var(--shadow); margin-left: 3px; transition: transform 0.2s; }
  .theme-btn:active { transform: scale(0.9); }
  
  /* AES BANNER */
  .aes-banner { background: var(--grad-hero); border-radius: 24px; padding: 16px 18px; margin-bottom: 12px; color: white; position: relative; overflow: hidden; box-shadow: 0 14px 36px rgba(255,107,107,0.22); cursor: pointer; transition: transform 0.2s; }
  .aes-banner:active { transform: scale(0.98); }
  .aes-banner::after { content: "▲"; position: absolute; top: -20px; right: -8px; font-size: 110px; opacity: 0.18; line-height: 1; }
  .aes-pill { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 3px 9px; border-radius: 10px; font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .aes-big { font-size: 36px; font-weight: 900; letter-spacing: -1.4px; line-height: 1; margin-bottom: 3px; }
  .aes-big .small { font-size: 12px; opacity: 0.92; font-weight: 700; }
  .aes-traj { font-size: 12px; font-weight: 700; opacity: 0.96; margin-top: 4px; }
  
  /* CHIPS - subject filter */
  .chips-wrap { margin-bottom: 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 8px 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 100px; font-size: 12px; font-weight: 800; color: var(--text-soft); white-space: nowrap; cursor: pointer; transition: all 0.15s; box-shadow: var(--shadow); }
  .chip:active { transform: scale(0.94); }
  .chip.active { background: var(--text); color: var(--bg-1); border-color: var(--text); }
  
  /* CARD BASE */
  .card { background: var(--surface); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); border: 1px solid var(--border); border-radius: 22px; padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .card-label { font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--text-mute); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .card-label .badge { background: var(--accent); color: white; padding: 2px 7px; border-radius: 100px; font-size: 9px; letter-spacing: 0.5px; }
  .card-q { font-size: 20px; font-weight: 900; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 12px; color: var(--text); }
  
  /* DAILY SAT Q CARD */
  .dq-card { border: 2px solid var(--accent); }
  .dq-question { font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text); margin-bottom: 12px; }
  .dq-opts { display: grid; gap: 6px; }
  .dq-opt { background: var(--surface-2); border: 1px solid var(--border); padding: 10px 13px; border-radius: 12px; font-size: 13px; cursor: pointer; transition: all 0.15s; color: var(--text); text-align: left; font-family: inherit; font-weight: 600; }
  .dq-opt:active { transform: scale(0.98); }
  .dq-opt.correct { background: #10b981; color: white; border-color: #10b981; }
  .dq-opt.wrong { background: #ff5e7e; color: white; border-color: #ff5e7e; }
  .dq-feedback { margin-top: 10px; padding: 11px 13px; background: var(--surface-2); border-radius: 12px; font-size: 12px; line-height: 1.5; color: var(--text-soft); }
  .dq-feedback strong { color: var(--text); }
  
  /* HERO LECTURE CARD */
  .hero-card { border-radius: 22px; overflow: hidden; position: relative; min-height: 180px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; }
  .hero-card .bg { position: absolute; inset: 0; }
  .hero-card .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.5)); }
  .hero-symbol { position: absolute; bottom: -20px; right: -5px; font-size: 140px; opacity: 0.18; font-family: Georgia, serif; font-style: italic; color: white; line-height: 1; }
  .hero-content { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; color: white; }
  .hero-meta { position: absolute; top: 14px; left: 18px; right: 18px; display: flex; justify-content: space-between; color: white; font-size: 10px; font-weight: 800; letter-spacing: 1px; opacity: 0.92; }
  .hero-pill { display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px; }
  .hero-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.1; margin-bottom: 4px; }
  .hero-prof { font-size: 12px; opacity: 0.92; font-weight: 700; }
  
  /* TODAY CARD */
  .today-prompt-wrap { background: var(--surface-2); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .today-prompt { font-size: 15px; font-weight: 700; line-height: 1.4; color: var(--text); margin-bottom: 10px; }
  .today-prompt .em { color: var(--accent); }
  .today-input { width: 100%; background: var(--bg-1); border: 1px solid var(--border); color: var(--text); padding: 11px 13px; border-radius: 12px; font-size: 13px; font-family: inherit; font-weight: 500; resize: none; min-height: 60px; line-height: 1.5; }
  .today-input:focus { outline: none; border-color: var(--accent); }
  .today-rings { display: flex; gap: 9px; padding: 12px; background: var(--surface-2); border-radius: 16px; }
  .ring-block { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .ring-svg { width: 34px; height: 34px; flex-shrink: 0; }
  .ring-svg circle { fill: none; stroke-width: 4.5; stroke-linecap: round; }
  .ring-bg-c { stroke: var(--border); }
  .ring-info .lbl { font-size: 9px; font-weight: 900; color: var(--text-mute); letter-spacing: 1px; }
  .ring-info .val { font-size: 14px; font-weight: 900; color: var(--text); letter-spacing: -0.3px; line-height: 1; margin-top: 1px; }
  
  /* AI TUTOR CARD */
  .tutor-card { background: var(--grad-hero); color: white; position: relative; overflow: hidden; cursor: pointer; }
  .tutor-card::after { content: "✦"; position: absolute; top: -15px; right: -5px; font-size: 100px; opacity: 0.18; line-height: 1; }
  .tutor-card .card-label { color: rgba(255,255,255,0.8); }
  .tutor-card .card-q { color: white; }
  .tutor-card-sub { font-size: 12px; opacity: 0.92; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
  .prof-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .prof-chip { background: rgba(255,255,255,0.22); backdrop-filter: blur(8px); padding: 5px 9px; border-radius: 11px; font-size: 10px; font-weight: 800; color: white; }
  
  /* LECTURE LIST */
  .lec-row { display: flex; gap: 10px; align-items: center; padding: 11px 13px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 6px; }
  .lec-row.done { opacity: 0.55; }
  .lec-num { flex-shrink: 0; width: 30px; height: 30px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: var(--text); }
  .lec-row.done .lec-num { background: var(--accent); color: white; }
  .lec-row.done .lec-num::before { content: "✓"; }
  .lec-row.done .lec-num .n { display: none; }
  .lec-info { flex: 1; min-width: 0; }
  .lec-title { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.25; }
  .lec-meta { font-size: 10px; color: var(--text-mute); font-weight: 700; margin-top: 1px; }
  .lec-actions { display: flex; gap: 4px; }
  .ic-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; color: var(--text); font-weight: 800; }
  .ic-btn.open { background: var(--text); color: var(--bg-1); border-color: var(--text); }
  .ic-btn.check.done { background: var(--accent); color: white; border-color: var(--accent); }
  
  /* LIVE SESSION */
  .live-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 11px; margin-bottom: 8px; display: flex; gap: 11px; box-shadow: var(--shadow); }
  .live-cover { flex-shrink: 0; width: 60px; height: 60px; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: white; font-family: Georgia, serif; font-style: italic; font-size: 28px; }
  .live-info { flex: 1; min-width: 0; }
  .live-pill { display: inline-block; background: var(--grad-hero); color: white; font-size: 9px; font-weight: 900; letter-spacing: 0.5px; padding: 3px 7px; border-radius: 7px; margin-bottom: 4px; }
  .live-title { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.25; margin-bottom: 2px; }
  .live-org { font-size: 10px; color: var(--text-mute); font-weight: 700; margin-bottom: 4px; }
  .live-actions { display: flex; gap: 5px; }
  .mini-btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: 11px; font-weight: 800; color: var(--text); cursor: pointer; font-family: inherit; }
  .mini-btn.primary { background: var(--text); color: var(--bg-1); border-color: var(--text); }
  
  /* ERROR LOG */
  .errlog-add { background: var(--accent); color: white; border: none; width: 100%; padding: 12px; border-radius: 14px; font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit; }
  .errlog-entry { background: var(--surface-2); border-radius: 12px; padding: 9px 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 9px; }
  .err-cat { font-size: 9px; font-weight: 900; color: white; background: var(--accent); padding: 3px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
  .err-note { flex: 1; font-size: 12px; color: var(--text); font-weight: 600; }
  .err-del { background: none; border: none; color: var(--text-mute); cursor: pointer; font-size: 16px; font-weight: 800; }
  
  /* PROGRESS BAR */
  .progress-bar { height: 6px; background: var(--surface-2); border-radius: 100px; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
  .progress-fill { height: 100%; background: var(--grad-hero); border-radius: 100px; transition: width 0.5s; }
  
  /* YEAR CARD */
  .year-card { background: var(--grad-hero); color: white; position: relative; overflow: hidden; }
  .year-card::after { content: "🎁"; position: absolute; top: -8px; right: 8px; font-size: 70px; opacity: 0.18; line-height: 1; }
  .year-card .card-label { color: rgba(255,255,255,0.75); }
  .year-card .card-q { color: white; }
  .year-card .card-sub { color: rgba(255,255,255,0.92); font-size: 12px; font-weight: 700; }
  
  /* BOTTOM SHEET */
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--surface-2); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-top: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 6px 12px 18px; z-index: 100; box-shadow: 0 -8px 32px rgba(0,0,0,0.06); }
  .sheet-handle { width: 36px; height: 4px; background: var(--text-mute); border-radius: 100px; margin: 4px auto 10px; opacity: 0.4; }
  .qa-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .qa-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: all 0.15s; font-family: inherit; color: var(--text); }

function checkDaily() {
  const today = new Date().toDateString();
  if (state.lastOpen !== today) {
    if (state.lastOpen) {
      const last = new Date(state.lastOpen);
      const diff = Math.floor((new Date() - last) / 86400000);
      if (diff === 1) state.streak += 1;
      else if (diff > 1) state.streak = Math.max(1, state.streak - 1);
    } else state.streak = 1;
    state.lastOpen = today;
    save();
  }
  if (state.ringsDate !== today) {
    state.ringsDate = today;
    state.rings = { study: 0, apply: 0, self: 0 };
    save();
  }
  if (state.promptDate !== today) {
    state.promptDate = today;
    state.promptIdx = Math.floor(Math.random()*PROMPTS.length);
    state.promptAnswer = "";
    save();
  }
  if (state.dqDate !== today) {
    state.dqDate = today;
    state.dqIdx = (state.dqIdx + 1) % DAILY_Q.length;
    state.dqAnswered = null;
    save();
  }
}
checkDaily();

function daysToSAT() { return Math.max(0, Math.ceil((new Date(SAT_DATE) - new Date()) / 86400000)); }
function daysToAES() { return Math.max(0, Math.ceil((new Date(AES_DEADLINE) - new Date()) / 86400000)); }
function milesDone() { return Object.values(state.milestones).filter(Boolean).length; }
function projectedSAT() {
  const total = LECTURES.sat.length + LECTURES.algebra.length;
  let done = subDone("sat") + subDone("algebra");
  return Math.round(BASELINE_SAT + (TARGET_SAT - BASELINE_SAT) * Math.min(1, done/total));
}
function subDone(s) { return Object.values(state.progress[s]||{}).filter(Boolean).length; }
function getAllSubjects() {
  const merged = { ...SUBJECTS };
  Object.entries(state.customSubjects||{}).forEach(([id, s]) => {
    merged[id] = { name: s.name, icon: s.icon, prof: s.inst, inst: s.inst, grad: s.gradVar || "--grad-collin", url: s.url || "", custom: true };
  });
  return merged;
}
function getLectures(k) {
  if (LECTURES[k]) return LECTURES[k];
  if (state.customSubjects && state.customSubjects[k]) return state.customSubjects[k].lectures;
  return null;
}
function subTotal(s) { const l = getLectures(s); return l ? l.length : 0; }
function isLecDone(s, i) { return !!(state.progress[s] && state.progress[s][i]); }
function toggleLec(s, i) {
  if (!state.progress[s]) state.progress[s] = {};
  const was = state.progress[s][i];
  state.progress[s][i] = !was;
  if (!was) { state.xp += 10; if (navigator.vibrate) navigator.vibrate(15); }
  save(); render();
}

let STATUS = null;            // decrypted object

function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decStatus(pass, f){
  if (f.v === 2) {
    // v2: status sealed with a public key (publisher needs no passcode); passcode unlocks the private key.
    if (!KEY_FILE) { const r = await fetch("key.enc.json?ts=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw new Error("nokey"); KEY_FILE = await r.json(); }
    const km2 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const kk = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(KEY_FILE.salt), iterations:KEY_FILE.iter, hash:"SHA-256"}, km2, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pk8 = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(KEY_FILE.iv)}, kk, b64(KEY_FILE.ct));
    const priv = await crypto.subtle.importKey("pkcs8", pk8, {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]);
    const raw = await crypto.subtle.decrypt({name:"RSA-OAEP"}, priv, b64(f.wk));
    const ak = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const pt2 = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(f.iv)}, ak, b64(f.ct));
    return JSON.parse(new TextDecoder().decode(pt2));
  }
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(f.salt), iterations:f.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(f.iv)}, key, b64(f.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function tryUnlock(pass, remember){
  if (!ENC_FILE) return false;

  const urgent = open.filter(s=>dleft(s.d)<=7);
  const lines = [];
  if (n===0) lines.push("You have not submitted anything this week yet. The goal is one a week, so pick the smallest one and finish it. A done application beats a perfect draft.");
  else lines.push(`Nice: ${n} submitted this week. Goal met. Now protect the habit: same hour every Sunday.`);
  if (urgent.length) lines.push(`${urgent.length} item${urgent.length>1?"s are":" is"} due within 7 days: ${urgent.slice(0,3).map(s=>s.t).join("; ")}.`);
  if (nx) lines.push(`Next up: ${nx.t} (${fmtD(nx.d)}).`);
  lines.push("Before you spend hours on any award, make sure you are allowed to receive it. Many national awards need US citizenship or permanent residence. Ask Mom or Dad if unsure, and tick the box only after reading the rules.");
  return lines;
}

function statusCard(){
  if (STATUS_STATE !== "ok") return lockCard();
  const open = (STATUS.todos||[]).filter(t=>!state.td[t.id]).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).slice(0,3);
  return `<div class="card m-card"><div class="card-label"><span>📍 My college status</span><span class="badge">as of ${fmtD(STATUS.updated)}</span></div>
    <div class="card-q">${escapeH(STATUS.headline || "Here is where things stand.")}</div>
    ${(STATUS.schools||[]).slice(0,4).map(s=>`<div class="m-hist"><b>${escapeH(s.n)}</b> · ${escapeH(s.s)}</div>`).join("")}
    ${open.length ? `<div class="m-sub" style="margin-top:8px"><b>Do next:</b> ${open.map(t=>escapeH(t.t)+(t.due?" ("+fmtD(t.due)+")":"")).join(" · ")}</div>` : ""}
    ${staleNote()}
    <div class="m-row"><button class="m-btn" onclick="go('status')">Full status</button></div></div>`;
}
function mentorCard(){
  if (state.filter!=="all") return "";
  let h = statusCard();
  if (STATUS_STATE === "ok") {
    const nx = mentorNext(), n = subsThisWeek();
    h += `<div class="card"><div class="card-label"><span>🧭 Mentor</span><span class="badge">${n}/1 this week</span></div>
      <div class="card-q">${nx ? "Next: "+escapeH(nx.t) : "You are caught up. Find the next opportunity."}</div>
      ${nx ? `<div class="m-sub">${fmtD(nx.d)} ${dchip(nx.d)}</div>` : ""}
      <div class="m-row"><button class="m-btn" onclick="go('mentor')">Weekly check-in</button>
      <button class="m-btn alt" onclick="go('aid')">Aid tracker</button>
      <button class="m-btn alt" onclick="go('college')">College plan</button></div></div>`;
  }
  return h;
}

// ---------- Status view ----------
function renderStatus(){
  let html = `<button class="back-btn" onclick="go('home')">← back</button>
    <div class="detail-h">my <span class="em">status</span></div>`;
  if (STATUS_STATE !== "ok") { appEl.innerHTML = html + lockCard(); return; }
  html += `<div class="detail-sub">Updated ${fmtD(STATUS.updated)}. This updates by itself from the family file.</div>${staleNote()}`;
  html += `<div class="card"><div class="card-label">Schools</div>` + (STATUS.schools||[]).map(s=>`<div class="m-hist"><b>${escapeH(s.n)}</b> · ${escapeH(s.s)}${s.due?" · "+dchip(s.due):""}<br>${escapeH(s.note||"")}</div>`).join("") + `</div>`;
  html += `<div class="card"><div class="card-label">Your to-dos</div>` + ((STATUS.todos||[]).slice().sort((a,b)=>(a.due||"9").localeCompare(b.due||"9")).map(t=>`<label class="m-chk"><input type="checkbox" ${state.td[t.id]?"checked":""} onchange="tdToggle('${t.id}')"><span>${escapeH(t.t)}${t.who?" <i>("+escapeH(t.who)+")</i>":""}${t.due?" "+dchip(t.due):""}</span></label>${(t.how||[]).length?`<details style="margin:2px 0 10px 28px;"><summary style="cursor:pointer;font-size:12px;font-weight:800;color:var(--accent);">How to do it</summary><ol style="margin:6px 0 0 18px;font-size:13px;line-height:1.5;">${t.how.map(h=>`<li>${escapeH(h)}</li>`).join("")}</ol>${/^https:\/\//.test(t.url||"")?`<a href="${escapeH(t.url)}" target="_blank" rel="noopener noreferrer" style="font-size:12px;font-weight:800;">Open the official page</a>`:""}</details>`:""}`).join("") || `<div class="m-sub">Nothing open.</div>`) + `</div>`;
  const items = allSch(), sub = items.filter(s=>["sub","won"].includes(sget(s.id).st)).length;
  html += `<div class="card"><div class="card-label"><span>Scholarships</span><span>${sub} submitted · ${items.length} tracked</span></div><div class="m-row"><button class="m-btn" onclick="go('aid')">Open aid tracker</button></div></div>`;
  if ((STATUS.opps||[]).length) html += `<div class="card"><div class="card-label">Opportunities for you</div>${STATUS.opps.slice().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).map(o=>`<p class="m-p"><b>${escapeH(o.t)}</b>${o.kind?" · "+escapeH(o.kind):""}${o.date?" "+dchip(o.date):""}<br>${escapeH(o.where||"")}${o.elig?`<br><i>Who can apply: ${escapeH(o.elig)}</i>`:""}${/^https:\/\//.test(o.url||"")?`<br><a href="${escapeH(o.url)}" target="_blank" rel="noopener noreferrer">Details</a>`:""}</p>`).join("")}</div>`;
  if ((STATUS.events||[]).length) html += `<div class="card"><div class="card-label">Events for you</div>${STATUS.events.slice().sort((a,b)=>(a.date||"9").localeCompare(b.date||"9")).map(e=>`<p class="m-p"><b>${escapeH(e.t)}</b>${e.date?" "+dchip(e.date):""}<br>${escapeH(e.where||"")}${e.why?" · "+escapeH(e.why):""}${/^https:\/\//.test(e.url||"")?`<br><a href="${escapeH(e.url)}" target="_blank" rel="noopener noreferrer">Details</a>`:""}</p>`).join("")}</div>`;
  if ((STATUS.imm||[]).length) html += `<div class="card"><div class="card-label">Your visa: what to know and do</div>${STATUS.imm.map(m=>`<p class="m-p"><b>${escapeH(m.t)}</b>${m.due?" "+dchip(m.due):""}<br>${escapeH(m.note||"")}</p>`).join("")}</div>`;
  if ((STATUS.money||[]).length) html += `<div class="card"><div class="card-label">Cost and aid notes</div>${STATUS.money.map(m=>`<p class="m-p">${escapeH(m)}</p>`).join("")}</div>`;
  if ((STATUS.confirm||[]).length) html += `<div class="card"><div class="card-label">Still to confirm with Mom or Dad</div>${STATUS.confirm.map(m=>`<p class="m-p">• ${escapeH(m)}</p>`).join("")}</div>`;
  html += `<div class="card"><div class="m-row"><button class="m-btn alt" onclick="forgetDevice()">Lock and forget passcode on this device</button></div></div>`;
  appEl.innerHTML = html;
}

// ---------- Mentor view ----------
function renderMentor(){
  const wk = weekStart().toISOString().slice(0,10);
  const done = state.checkins.find(c=>c.wk===wk);
  let html = `<button class="back-btn" onclick="go('home')">← back</button>
    <div class="detail-h">your <span class="em">mentor</span></div>
    <div class="detail-sub">Honest read of where you are, then one next step</div>
    <div class="card m-card"><div class="card-label">Coach's read</div>${mentorNote().map(l=>`<p class="m-p">${escapeH(l)}</p>`).join("")}</div>`;
  if (STATUS_STATE !== "ok") html += lockCard();
  html += `<div class="card"><div class="card-label"><span>Weekly check-in</span><span>${done?"✓ done this week":"takes 2 minutes"}</span></div>
      <label class="m-l">One win this week</label>
      <textarea class="today-input" id="ciWin" placeholder="Anything counts: a draft, a question asked, a lab you understood">${escapeH(done?done.win:"")}</textarea>
      <label class="m-l">What is blocking you?</label>
      <textarea class="today-input" id="ciBlock" placeholder="Essay start, a letter, a form, motivation, time...">${escapeH(done?done.block:"")}</textarea>
      <label class="m-l">Who can help? (a teacher, counselor, parent, friend)</label>
      <input class="chat-in" id="ciHelp" value="${escapeH(done?done.help:"")}" placeholder="Name one person and what to ask them">
      <label class="m-l">Energy this week: <span id="ciEnV">${done?done.en:3}</span>/5</label>
      <input type="range" min="1" max="5" value="${done?done.en:3}" id="ciEn" oninput="document.getElementById('ciEnV').textContent=this.value" style="width:100%">
      <button class="m-btn" style="margin-top:10px" onclick="saveCheckin()">Save check-in</button></div>
    <div class="card"><div class="card-label">Ask the mentor (AI)</div><div class="quick-row">
        <span class="quick-chip" onclick="askMentor('Help me outline a scholarship essay about a time I changed my mind. Ask me 3 questions first.')">Essay outline</span>
        <span class="quick-chip" onclick="askMentor('Give me a 5-step plan to finish one scholarship application in 90 minutes.')">90-min plan</span>
        <span class="quick-chip" onclick="askMentor('How do I politely ask a teacher for a recommendation letter?')">Ask for a letter</span>
        <span class="quick-chip" onclick="askMentor('What should a first-year mechanical engineering student do to stand out?')">Freshman edge</span></div>
      <div class="m-sub">The AI chat is a free outside service. Never type ID numbers, addresses, or immigration or money details into it.</div></div>
    <div class="card"><div class="card-label">Essay story bank</div>
      <div class="m-sub">Write 3 to 5 true stories once (a failure, a leadership moment, a challenge, why engineering). Reuse them across applications.</div>
      <textarea class="today-input" style="min-height:120px" onblur="state.essayNotes=this.value;save();">${escapeH(state.essayNotes)}</textarea></div>`;
  if (state.checkins.length) html += `<div class="card"><div class="card-label">Past check-ins</div>` + state.checkins.slice(-6).reverse().map(c=>`<div class="m-hist"><b>Week of ${c.wk}</b> · energy ${c.en}/5<br>Win: ${escapeH(c.win||"-")}<br>Blocker: ${escapeH(c.block||"-")}</div>`).join("") + `</div>`;
  appEl.innerHTML = html;
}
function saveCheckin(){
  const wk = weekStart().toISOString().slice(0,10);
  const rec = {wk, win:document.getElementById("ciWin").value.trim(), block:document.getElementById("ciBlock").value.trim(), help:document.getElementById("ciHelp").value.trim(), en:+document.getElementById("ciEn").value};
  const i = state.checkins.findIndex(c=>c.wk===wk);
  if (i>=0) state.checkins[i]=rec; else { state.checkins.push(rec); state.xp += 30; state.rings.self = Math.min(1,(state.rings.self||0)+1); }
  save(); render();
}
function askMentor(q){ state.view="tutor"; save(); render(); setTimeout(()=>{ const i=document.getElementById("chatIn"); if(i){ i.value=q; sendChat(); } }, 60); }

// ---------- Aid tracker ----------
function renderAid(){
  const items = allSch();
  const submitted = items.filter(s=>["sub","won"].includes(sget(s.id).st)).length;
  let html = `<button class="back-btn" onclick="go('home')">← back</button>
    <div class="detail-h">aid <span class="em">tracker</span></div>
    <div class="detail-sub">${submitted} submitted · ${subsThisWeek()} this week · goal 1 a week. No award is guaranteed.</div>`;
  if (STATUS_STATE !== "ok") html += lockCard();
  html += `<div class="card m-card"><div class="card-label">Rules of the hunt</div>
      <p class="m-p">1. Confirm you are allowed to receive it (citizenship or residency rules). 2. Reuse your essay stories. 3. Apply to local and niche awards, odds are better. 4. Ask each school's financial aid office what merit awards you can get, and compare <b>net cost</b>.</p></div>`;
  items.forEach(s=>{
    const v = sget(s.id);
    html += `<div class="card m-item ${v.st==='won'?'won':''}">
      <div class="m-top"><div class="m-title">${escapeH(s.t)}</div>${dchip(s.d)}</div>
      <div class="m-sub">${fmtD(s.d)}${s.amt?" · "+escapeH(s.amt):""}</div>
      <div class="m-note">${escapeH(s.note||"")}</div>
      <div class="m-row">
        <button class="m-btn ${v.st==='todo'?'alt':''}" onclick="cycleSch('${s.id}')">${SCH_LABEL[v.st]||SCH_LABEL.todo}</button>
        <button class="m-btn alt" onclick="searchSch(${JSON.stringify(s.t).replace(/"/g,'&quot;')})">Rules ↗</button>
        <label class="m-elig"><input type="checkbox" ${v.elig?"checked":""} onchange="toggleElig('${s.id}')"> I checked I'm eligible</label>
        ${s.custom?`<button class="m-btn alt" onclick="delSch('${s.id}')">Remove</button>`:""}</div></div>`;
  });
  html += `<div class="card"><div class="card-label">Add an opportunity</div>
      <input class="chat-in" id="schName" placeholder="Name"><div style="height:6px"></div>
      <input class="chat-in" id="schDate" type="date"><div style="height:6px"></div>
      <input class="chat-in" id="schAmt" placeholder="Amount (optional)"><div style="height:8px"></div>
      <button class="m-btn" onclick="addSch()">Add</button></div>
    <div class="card"><div class="card-label">Where to find more (opens a search)</div><div class="quick-row">
      ${["engineering scholarships for women Texas","scholarships for international students in Texas","mechanical engineering scholarships ASME","scholarships incoming engineering freshmen","local Frisco Plano scholarships seniors"].map(q=>`<span class="quick-chip" onclick="window.open('https://www.google.com/search?q='+encodeURIComponent(${JSON.stringify(q).replace(/"/g,'&quot;')}),'_blank')">${q}</span>`).join("")}</div></div>`;
  appEl.innerHTML = html;
}

// ---------- College plan (generic, no personal data) ----------
const COL_READY = [
  ["r1","Calculus I solid (and Calculus II started if credits allow). Ask your advisor which credits transfer and what placement tests exist."],
  ["r2","Physics: mechanics first, then electricity and magnetism. Engineering physics is where many first-years struggle."],
  ["r3","Learn Python or MATLAB basics. Almost every mechanical engineering course uses one."],
  ["r4","Try CAD with free student or personal-use tools (Fusion, Onshape). Make 3 small parts."],
  ["r5","Build something physical: a robot, a bike repair, a 3D print. Photograph it for your portfolio."],
  ["r6","Chemistry and statistics are common requirements. Check the degree plan before taking extra classes."]
];
const COL_YEAR1 = [
  ["y1","Go to office hours in week 2 of every class, not week 12"],
  ["y2","Join one engineering team or club (design/build teams, SWE, robotics) in the first month"],
  ["y3","Ask a professor about undergraduate research before the end of freshman year"],
  ["y4","Use tutoring or supplemental instruction early, before grades slip"],
  ["y5","Build a one-page resume and apply for a summer internship or program by February"],
  ["y6","Meet your engineering advisor each semester and map the 4-year plan"],
  ["y7","Re-apply for scholarships every year: many renew only with a GPA minimum"]
];
function colCheck(id){ state.col[id]=!state.col[id]; save(); render(); }
function colList(arr){ return arr.map(([id,t])=>`<label class="m-chk"><input type="checkbox" ${state.col[id]?"checked":""} onchange="colCheck('${id}')"><span>${escapeH(t)}</span></label>`).join(""); }
function renderCollege(){
  let html = `<button class="back-btn" onclick="go('home')">← back</button>
    <div class="detail-h">college <span class="em">plan</span></div>
    <div class="detail-sub">Choose smart, then show up ready</div>`;
  if (STATUS_STATE === "ok" && (STATUS.schools||[]).length) {
    html += `<div class="card"><div class="card-label">Your options</div>` + STATUS.schools.map(s=>`<div class="m-hist"><b>${escapeH(s.n)}</b> · ${escapeH(s.s)}<br>${escapeH(s.note||"")}</div>`).join("") +
      `<p class="m-p" style="margin-top:8px">Decision tip: compare <b>net cost per year</b> (tuition + housing − aid), and ask each school about its 4-year graduation rate and engineering internship support.</p></div>`;
  } else html += lockCard();
  html += `<div class="card"><div class="card-label">Get ready for mechanical engineering</div>${colList(COL_READY)}</div>
    <div class="card"><div class="card-label">First-year playbook</div>${colList(COL_YEAR1)}</div>
    <div class="card"><div class="card-label">Ask the mentor (AI)</div><div class="quick-row">
      <span class="quick-chip" onclick="askMentor('Explain what a first-year mechanical engineering course load looks like and how to prepare this summer.')">First-year load</span>
      <span class="quick-chip" onclick="askMentor('How do I find undergraduate research or a design team as a freshman engineer?')">Research & teams</span>
      <span class="quick-chip" onclick="askMentor('Help me compare two engineering schools by net cost and outcomes. Ask what I need.')">Compare schools</span></div></div>`;
  appEl.innerHTML = html;
}
function toggleMore(){ state.more = !state.more; save(); render(); }
initStatus();

render();
</script>
